<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我們的專屬大富翁 - Wei ❤️ Alice Afterparty</title>
  <!-- Google Fonts: Zen Maru Gothic (日系圓體) + Fredoka (可愛圓體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons Free 6.4.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-cream: #F9F6F0;
      --card-bg: #FFFFFF;
      --morandi-rose: #E2B4BD;
      --morandi-rose-dark: #C48B96;
      --morandi-sage: #A7B8A0;
      --morandi-sand: #D8C3A5;
      --morandi-blue: #9BB7D4;
      --morandi-purple: #B5A7C9;
      --morandi-terracotta: #D98A72;
      
      /* Foil Stamp High Contrast Gold Palette */
      --foil-gold-text: linear-gradient(135deg, #FFE8A3 0%, #FDF0A6 25%, #D4AF37 50%, #FFF5CC 75%, #C5A059 100%);
      
      --text-main: #4A403A;
      --text-muted: #8C7A6B;
      --border-color: #E6DCD0;
      --radius-lg: 20px;
      --radius-md: 16px;
      --shadow-soft: 0 10px 30px rgba(120, 100, 80, 0.08);
      --font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background-color: #ECE5DC;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Deck Frame */
    .deck-container {
      width: 100vw;
      height: 100vh;
      max-width: 1920px;
      max-height: 1080px;
      background-color: var(--bg-cream);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .slide {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      position: absolute;
      top: 0; left: 0;
      padding: 2rem 3rem;
    }
    .slide.active { display: flex; }

    /* Slide 1: Cover */
    .cover-slide {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      gap: 4rem;
    }
    .cover-photo-wrapper {
      flex: 1;
      height: 80%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .polaroid-frame {
      background: white;
      padding: 1.5rem 1.5rem 2rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      transform: rotate(-3deg);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      max-width: 480px;
      width: 100%;
    }
    .polaroid-frame:hover {
      transform: rotate(0deg) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .polaroid-img {
      width: 100%;
      height: 480px;
      object-fit: cover;
      object-position: 50% 98%;
      border-radius: 6px;
      filter: grayscale(80%) contrast(120%) sepia(20%);
    }

    .cover-content {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }
    .badge {
      background-color: var(--morandi-rose);
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
    }
    .cover-title {
      font-size: 4.2rem;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    .names-tag {
      font-size: 2.2rem;
      color: var(--morandi-rose-dark);
      font-weight: 700;
      margin-bottom: 2.5rem;
    }
    .start-btn {
      background: var(--morandi-rose-dark);
      color: white;
      border: none;
      padding: 1.2rem 3rem;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(196, 139, 150, 0.4);
      transition: all 0.2s ease;
      font-family: var(--font-family);
    }
    .start-btn:hover {
      transform: translateY(-3px);
      background: #B37B86;
    }

    /* Board Slide Header */
    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .header-title {
      font-size: 1.8rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .header-title i { color: var(--morandi-rose-dark); }
    .header-controls {
      display: flex;
      gap: 0.8rem;
    }
    .tool-btn {
      background: white;
      border: 1.5px solid var(--border-color);
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      font-family: var(--font-family);
      transition: all 0.2s;
    }
    .tool-btn:hover { background: var(--bg-cream); }

    /* Monopoly Board Grid */
    .monopoly-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 14px;
      flex: 1;
      position: relative;
    }
    
    .cell {
      background: white;
      border-radius: var(--radius-md);
      padding: 1rem 0.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: var(--shadow-soft);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .cell:hover {
      transform: translateY(-4px);
      border-color: var(--morandi-rose);
    }

    .cell-icon {
      font-size: 2.3rem;
      color: var(--morandi-rose-dark);
      margin-bottom: 0.5rem;
    }
    .cell-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* Center Section - High-Contrast Foil Badge Style */
    .board-center {
      grid-column: 2 / 5;
      grid-row: 2 / 4;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      border: 2px solid #D4AF37;
      box-shadow: 0 10px 30px rgba(120, 100, 80, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      position: relative;
    }

    .center-wedding-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      z-index: 2;
      background: linear-gradient(135deg, #4A3A35 0%, #2D2320 100%);
      padding: 0.8rem 2.2rem;
      border-radius: 18px;
      border: 2px solid #D4AF37;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      width: 90%;
    }
    .center-logo-badge {
      font-size: 0.75rem;
      letter-spacing: 3px;
      font-weight: 800;
      color: #FDF0A6;
      background: rgba(212, 175, 55, 0.2);
      padding: 0.2rem 0.9rem;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.5);
    }
    .center-logo-names {
      font-size: 2.2rem;
      font-weight: 900;
      background: var(--foil-gold-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .center-logo-sub {
      font-size: 0.9rem;
      font-style: italic;
      color: #E2D7C8;
      letter-spacing: 1px;
    }

    .turn-badge {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text-main);
      background: white;
      padding: 0.4rem 1.8rem;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
      z-index: 2;
    }

    /* Refined Clean 3D Cute Dice */
    .dice-scene {
      width: 80px;
      height: 80px;
      perspective: 600px;
      margin: 0.2rem 0;
      z-index: 2;
    }
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.25, 1.2, 0.35, 1);
    }
    .cube-face {
      position: absolute;
      width: 80px;
      height: 80px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: inset 0 0 0 2px #E6DCD0, inset 0 -3px 6px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.08);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 10px;
      align-items: center;
      justify-items: center;
      backface-visibility: hidden;
    }
    .dot {
      width: 13px;
      height: 13px;
      background: var(--morandi-rose-dark);
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }
    .face-1 { transform: rotateY(0deg) translateZ(40px); }
    .face-2 { transform: rotateY(90deg) translateZ(40px); }
    .face-3 { transform: rotateY(180deg) translateZ(40px); }
    .face-4 { transform: rotateY(-90deg) translateZ(40px); }
    .face-5 { transform: rotateX(90deg) translateZ(40px); }
    .face-6 { transform: rotateX(-90deg) translateZ(40px); }

    .btn-group {
      display: flex;
      gap: 1rem;
      z-index: 2;
    }
    .roll-btn {
      background: var(--morandi-rose-dark);
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(196, 139, 150, 0.3);
      font-family: var(--font-family);
    }
    .roll-btn:hover { background: #B37B86; }
    
    .next-btn {
      background: var(--text-main);
      color: white;
      border: none;
      padding: 0.8rem 1.6rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 40px;
      cursor: pointer;
      font-family: var(--font-family);
    }

    /* High-Visibility Pawns System */
    .pawn-container {
      position: absolute;
      bottom: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      padding: 0 4px;
    }
    .pawn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: white;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25), 0 0 0 2.5px white;
      font-weight: bold;
      transition: all 0.3s;
    }
    .pawn-animating {
      animation: pawnJump 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pawnJump {
      0% { transform: translateY(-30px) scale(1.6); opacity: 0.5; }
      50% { transform: translateY(-10px) scale(1.2); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Slide 3: Intermission */
    .intermission-slide {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
    }
    .intermission-title {
      font-size: 4rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }
    .intermission-sub {
      font-size: 1.8rem;
      color: var(--text-muted);
      margin-bottom: 3rem;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(74, 64, 58, 0.4);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      text-align: center;
      position: relative;
    }
    .modal-title {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 1rem;
      color: var(--text-main);
    }
    .modal-desc {
      font-size: 1.35rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .modal-close-btn {
      background: var(--text-main);
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      font-family: var(--font-family);
    }

    /* Category Tab Edit Forms */
    .tab-header {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-family: var(--font-family);
      font-size: 0.9rem;
      font-weight: 700;
    }
    .tab-btn.active {
      background: var(--morandi-rose-dark);
      color: white;
      border-color: var(--morandi-rose-dark);
    }
    .edit-form-group {
      text-align: left;
      margin-bottom: 1rem;
    }
    .edit-form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
    .edit-form-group textarea, .edit-form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-family: var(--font-family);
      font-size: 0.95rem;
    }
    .hidden-input { display: none; }
  </style>
</head>
<body>

  <div class="deck-container">

    <!-- Slide 1: Cover -->
    <div class="slide slide-1 active">
      <div class="cover-slide">
        <div class="cover-photo-wrapper">
          <div class="polaroid-frame" onclick="document.getElementById('photo-uploader').click()">
            <img id="cover-photo" class="polaroid-img" src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" alt="婚紗照">
          </div>
          <input type="file" id="photo-uploader" class="hidden-input" accept="image/*" onchange="uploadCoverPhoto(event)">
        </div>
        <div class="cover-content">
          <div class="badge">WEDDING AFTERPARTY</div>
          <h1 class="cover-title">我們的專屬大富翁</h1>
          <div class="names-tag">Wei ❤️ Alice</div>
          <button class="start-btn" onclick="nextSlide()">開啟大富翁 ➔</button>
        </div>
      </div>
    </div>

    <!-- Slide 2: Monopoly Board -->
    <div class="slide slide-2">
      <div class="board-header">
        <div class="header-title">
          <i class="fa-solid fa-heart"></i>
          <span>我們的專屬大富翁</span>
        </div>
        <div class="header-controls">
          <button class="tool-btn" onclick="resetGame()"><i class="fa-solid fa-rotate-left"></i> 重新開始</button>
          <button class="tool-btn" onclick="goToSlide(0)"><i class="fa-solid fa-house"></i> 返回首頁</button>
          <button class="tool-btn" onclick="openSetupModal()"><i class="fa-solid fa-users"></i> 隊伍設定</button>
          <button class="tool-btn" onclick="openEditModal()"><i class="fa-solid fa-pen"></i> 編輯題目</button>
          <button class="tool-btn" onclick="nextSlide()"><i class="fa-solid fa-glass-cheers"></i> 中場休息</button>
        </div>
      </div>

      <div class="monopoly-board" id="board">
        <!-- Center Section with High Contrast Foil Stamp Gold Wedding Badge -->
        <div class="board-center">
          <div class="center-wedding-logo">
            <span class="center-logo-badge">WEDDING AFTERPARTY</span>
            <div class="center-logo-names">Wei ❤️ Alice</div>
            <div class="center-logo-sub">“Eat, Drink, and be Married!”</div>
          </div>

          <div class="turn-badge" id="turn-display">🔴 輪到：第一隊</div>
          
          <div class="dice-scene">
            <div class="cube" id="cube">
              <div class="cube-face face-1"><div class="dot" style="grid-area:2/2;"></div></div>
              <div class="cube-face face-2"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
              <div class="cube-face face-3"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:2/2;"></div><div class="dot" style="grid-area:3/3;"></div></div>
              <div class="cube-face face-4"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
              <div class="cube-face face-5"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:2/2;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
              <div class="cube-face face-6"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:2/1;"></div><div class="dot" style="grid-area:2/3;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
            </div>
          </div>

          <div class="btn-group">
            <button class="roll-btn" id="roll-btn" onclick="rollDice()">🎲 擲骰子</button>
            <button class="next-btn" onclick="nextTurn()">下一隊</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Slide 3: Intermission -->
    <div class="slide slide-3">
      <div class="intermission-slide">
        <h1 class="intermission-title">Intermission 中場休息</h1>
        <p class="intermission-sub">敬酒、合照、享用美食與美酒 🥂</p>
        <button class="start-btn" onclick="goToSlide(1)">↩️ 返回大富翁遊戲</button>
      </div>
    </div>

  </div>

  <!-- Challenge Modal -->
  <div class="modal-overlay" id="challenge-modal">
    <div class="modal-card">
      <h2 class="modal-title" id="modal-title">卡牌名稱</h2>
      <p class="modal-desc" id="modal-desc">詳細挑戰內容說明...</p>
      <button class="modal-close-btn" onclick="closeModal()">完成關卡</button>
    </div>
  </div>

  <!-- Setup Modal -->
  <div class="modal-overlay" id="setup-modal">
    <div class="modal-card">
      <h2 class="modal-title">⚙️ 隊伍設定</h2>
      <div class="edit-form-group">
        <label>選擇隊伍數量：</label>
        <select id="team-count-select" onchange="updateTeamInputs()" style="width:100%; padding:0.8rem; border-radius:10px; border:1.5px solid var(--border-color); font-family:var(--font-family);">
          <option value="2">2 組隊伍</option>
          <option value="3" selected>3 組隊伍</option>
          <option value="4">4 組隊伍</option>
          <option value="5">5 組隊伍</option>
          <option value="6">6 組隊伍</option>
        </select>
      </div>
      <div id="team-inputs-container"></div>
      <button class="modal-close-btn" onclick="saveTeamSetup()">儲存設定</button>
    </div>
  </div>

  <!-- Category Question Editor Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-card" style="max-width: 650px; text-align: left;">
      <h2 class="modal-title" style="text-align: center;">📝 編輯各類別題目</h2>
      
      <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('adventure', event)">🎭 大冒險</button>
        <button class="tab-btn" onclick="switchTab('gift', event)">🎁 小驚喜</button>
        <button class="tab-btn" onclick="switchTab('chance', event)">✨ 機會</button>
        <button class="tab-btn" onclick="switchTab('destiny', event)">🔮 命運</button>
        <button class="tab-btn" onclick="switchTab('truth', event)">💬 真心話</button>
      </div>

      <div class="edit-form-group">
        <label id="tab-label">編輯題目（每行一個選項）：</label>
        <textarea id="category-input" rows="8"></textarea>
      </div>

      <div style="text-align: center;">
        <button class="modal-close-btn" onclick="saveCategoryQuestions()">儲存題目</button>
      </div>
    </div>
  </div>

  <script>
    // State Management
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');

    let teams = [
      { name: '第一隊', color: '#E2B4BD', icon: '♟️', pos: 0 },
      { name: '第二隊', color: '#A7B8A0', icon: '♞', pos: 0 },
      { name: '第三隊', color: '#D8C3A5', icon: '♝', pos: 0 }
    ];
    let currentTeamIndex = 0;

    let currentTab = 'adventure';
    let cardPools = {
      adventure: [
        "鋼鐵人彈指 (Snap!)：戴上手套喊「I am Iron man」，新人配合演出倒下。(4秒影片)",
        "神奇寶貝大師：對新人丟精靈球喊「決定就是你了！」，新人擺出收服姿勢。(定格拍照)",
        "蜘蛛人對決：與新人同時半蹲擺出雙手吐絲姿勢互瞪。(定格拍照)",
        "奧德修斯神弓：拉開隱形大弓瞄準新人，新人配合誇張後仰。(定格拍照)",
        "咒術迴戰領域展開：雙手結印喊「無量空處」，新人做出當機表情。(定格拍照)",
        "芙莉蓮飛吻暴擊：對新人送出飛吻，新人模仿勇者倒下。(4秒影片)",
        "間諜家家酒安妮亞：雙手抱胸，對著鏡頭做出鄙視表情。(定格拍照)",
        "名偵探柯南麻醉槍：假裝用手錶射擊，新人瞬間沉睡癱倒。(4秒影片)"
      ],
      gift: [
        "🎁 獲得 Alice / Wei 深情親親臉頰 10 秒！",
        "🎁 現場餵食特權：由新人現場親手餵你吃甜點蛋糕！",
        "🎁 拍立得合照：獲得與新人現場拍立得合照乙張！"
      ],
      chance: [
        "✨ 機會：指定現場一位伴郎代表替你執行下一次任務！",
        "✨ 機會：指定現場一位伴娘代表替你執行下一次任務！"
      ],
      destiny: [
        "🔮 命運：現場真心話，回答 Alice 或 Wei 一個熱門八卦問題！",
        "🔮 命運：全場連坐乾杯！邀請你那一桌親友一起舉杯！"
      ],
      truth: [
        "💬 真心話：誠實回答～第一次看到 Wei / Alice 時的第一印象是什麼？",
        "💬 真心話：現場爆料！分享一個新人交往期間你印象最深刻的甜爆小故事！"
      ]
    };

    const boardCellsData = [
      { id: 0, label: '起點', icon: 'fa-flag-checkered', type: 'start' },
      { id: 1, label: '大冒險', icon: 'fa-masks-theater', type: 'adventure' },
      { id: 2, label: '小驚喜', icon: 'fa-gift', type: 'gift' },
      { id: 3, label: '機會', icon: 'fa-wand-magic-sparkles', type: 'chance' },
      { id: 4, label: '大冒險', icon: 'fa-bolt', type: 'adventure' },
      { id: 5, label: '命運', icon: 'fa-compass', type: 'destiny' },
      { id: 6, label: '真心話', icon: 'fa-comments', type: 'truth' },
      { id: 7, label: '大冒險', icon: 'fa-clapperboard', type: 'adventure' },
      { id: 8, label: '小驚喜', icon: 'fa-heart', type: 'gift' },
      { id: 9, label: '機會', icon: 'fa-clover', type: 'chance' },
      { id: 10, label: '大冒險', icon: 'fa-dragon', type: 'adventure' },
      { id: 11, label: '命運', icon: 'fa-dice-d20', type: 'destiny' },
      { id: 12, label: '真心話', icon: 'fa-comment-dots', type: 'truth' },
      { id: 13, label: '大冒險', icon: 'fa-fire', type: 'adventure' }
    ];

    // Navigation
    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }
    function goToSlide(index) {
      slides[currentSlide].classList.remove('active');
      currentSlide = index;
      slides[currentSlide].classList.add('active');
    }

    // Photo Upload
    function uploadCoverPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('cover-photo').src = e.target.result;
          localStorage.setItem('wedding_cover_photo', e.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    // Reset All Teams to Start Position
    function resetGame() {
      if (confirm("確定要重新開始遊戲嗎？所有隊伍將回到起點。")) {
        teams.forEach(team => team.pos = 0);
        currentTeamIndex = 0;
        document.getElementById('turn-display').innerText = `${teams[0].icon} 輪到：${teams[0].name}`;
        renderPawns();
      }
    }

    // Initialize Board Grid
    function renderBoard() {
      const board = document.getElementById('board');
      const center = board.querySelector('.board-center');
      board.innerHTML = '';
      board.appendChild(center);

      const positions = [
        {r:1, c:1}, {r:1, c:2}, {r:1, c:3}, {r:1, c:4}, {r:1, c:5},
        {r:2, c:5}, {r:3, c:5}, {r:4, c:5},
        {r:4, c:4}, {r:4, c:3}, {r:4, c:2}, {r:4, c:1},
        {r:3, c:1}, {r:2, c:1}
      ];

      boardCellsData.forEach((cellData, idx) => {
        const pos = positions[idx];
        const cellEl = document.createElement('div');
        cellEl.className = 'cell';
        cellEl.style.gridRow = pos.r;
        cellEl.style.gridColumn = pos.c;

        cellEl.innerHTML = `
          <div class="cell-icon"><i class="fa-solid ${cellData.icon}"></i></div>
          <div class="cell-title">${cellData.label}</div>
          <div class="pawn-container" id="pawns-cell-${idx}"></div>
        `;

        cellEl.onclick = () => triggerCellEvent(cellData);
        board.appendChild(cellEl);
      });

      renderPawns();
    }

    function renderPawns(activeTeamIdx = -1) {
      boardCellsData.forEach((_, idx) => {
        const container = document.getElementById(`pawns-cell-${idx}`);
        if(container) container.innerHTML = '';
      });

      teams.forEach((team, idx) => {
        const container = document.getElementById(`pawns-cell-${team.pos}`);
        if(container) {
          const pawnEl = document.createElement('div');
          pawnEl.className = 'pawn';
          if (idx === activeTeamIdx) {
            pawnEl.classList.add('pawn-animating');
          }
          pawnEl.style.backgroundColor = team.color;
          pawnEl.innerText = team.icon;
          pawnEl.title = team.name;
          container.appendChild(pawnEl);
        }
      });
    }

    // 3D Rolling Dice & Animation Sequencing
    let isRolling = false;
    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      const cube = document.getElementById('cube');
      const rollBtn = document.getElementById('roll-btn');
      rollBtn.disabled = true;

      const rolled = Math.floor(Math.random() * 6) + 1;

      const rotations = {
        1: { x: 0, y: 0 },
        2: { x: 0, y: -90 },
        3: { x: 0, y: -180 },
        4: { x: 0, y: 90 },
        5: { x: -90, y: 0 },
        6: { x: 90, y: 0 }
      };

      const targetRot = rotations[rolled];
      const extraX = 1080;
      const extraY = 720;

      cube.style.transform = `rotateX(${targetRot.x + extraX}deg) rotateY(${targetRot.y + extraY}deg)`;

      setTimeout(() => {
        teams[currentTeamIndex].pos = (teams[currentTeamIndex].pos + rolled) % 14;
        renderPawns(currentTeamIndex);

        setTimeout(() => {
          const landedCell = boardCellsData[teams[currentTeamIndex].pos];
          triggerCellEvent(landedCell);
          isRolling = false;
          rollBtn.disabled = false;
        }, 650);

      }, 1000);
    }

    function nextTurn() {
      currentTeamIndex = (currentTeamIndex + 1) % teams.length;
      document.getElementById('turn-display').innerText = `${teams[currentTeamIndex].icon} 輪到：${teams[currentTeamIndex].name}`;
    }

    function triggerCellEvent(cell) {
      const modal = document.getElementById('challenge-modal');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');

      title.innerText = cell.label;

      const pool = cardPools[cell.type] || ["🎉 祝福 Wei & Alice 新婚快樂、永浴愛河！"];
      const randItem = pool[Math.floor(Math.random() * pool.length)];
      desc.innerText = randItem;

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('challenge-modal').classList.remove('active');
    }

    // Setup & Category Question Edit Modals
    function openSetupModal() {
      document.getElementById('setup-modal').classList.add('active');
      updateTeamInputs();
    }
    function updateTeamInputs() {
      const count = parseInt(document.getElementById('team-count-select').value);
      const container = document.getElementById('team-inputs-container');
      container.innerHTML = '';
      for(let i = 0; i < count; i++) {
        const name = teams[i] ? teams[i].name : `第 ${i+1} 隊`;
        container.innerHTML += `
          <div class="edit-form-group">
            <label>隊伍 ${i+1} 名稱：</label>
            <input type="text" id="team-name-${i}" value="${name}">
          </div>
        `;
      }
    }
    function saveTeamSetup() {
      const count = parseInt(document.getElementById('team-count-select').value);
      const colors = ['#E2B4BD', '#A7B8A0', '#D8C3A5', '#B5A7C9', '#9BB7D4', '#D98A72'];
      const icons = ['♟️', '♞', '♝', '♛', '♚', '♜'];
      teams = [];
      for(let i = 0; i < count; i++) {
        const name = document.getElementById(`team-name-${i}`).value || `第 ${i+1} 隊`;
        teams.push({ name, color: colors[i], icon: icons[i], pos: 0 });
      }
      currentTeamIndex = 0;
      document.getElementById('turn-display').innerText = `${teams[0].icon} 輪到：${teams[0].name}`;
      document.getElementById('setup-modal').classList.remove('active');
      renderPawns();
    }

    function openEditModal() {
      switchTab('adventure');
      document.getElementById('edit-modal').classList.add('active');
    }
    function switchTab(tabKey, evt) {
      currentTab = tabKey;
      if(evt) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        evt.target.classList.add('active');
      }
      document.getElementById('category-input').value = (cardPools[tabKey] || []).join('\n');
    }
    function saveCategoryQuestions() {
      const text = document.getElementById('category-input').value;
      cardPools[currentTab] = text.split('\n').filter(line => line.trim() !== '');
      document.getElementById('edit-modal').classList.remove('active');
    }

    // Load saved photo on startup
    window.onload = function() {
      const savedPhoto = localStorage.getItem('wedding_cover_photo');
      if(savedPhoto) {
        document.getElementById('cover-photo').src = savedPhoto;
      }
      renderBoard();
    };
  </script>
</body>
</html>
